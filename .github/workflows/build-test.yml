name: OpenWrt Build Test
run-name: OpenWrt AX9000 · ${{ inputs.runner_arch }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      runner_arch:
        description: Build runner architecture (firmware target remains AX9000)
        type: choice
        required: true
        default: x64
        options:
          - x64
          - arm64
      publish_release:
        description: Publish a test Release after a successful build
        type: boolean
        required: true
        default: false

# Different architectures can run concurrently for comparison.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.runner_arch }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  REMOTE_REPOSITORY: qosmio/openwrt-ipq
  REMOTE_BRANCH: 25.12-nss
  NSS_PACKAGES_REPOSITORY: qosmio/nss-packages
  NSS_PACKAGES_REPOSITORY_BRANCH: NSS-12.5-K6.x
  CONFIG_FILE: ax9000.config
  RELEASE_PREFIX: 25.12-nss-test
  ARTIFACT_RETENTION_DAYS: 7
  RELEASES_TO_KEEP: 2

jobs:
  resolve_sources:
    name: Resolve source revisions
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      main_sha: ${{ steps.resolve.outputs.main_sha }}
      nss_sha: ${{ steps.resolve.outputs.nss_sha }}
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - name: Resolve runner and upstream commits
        id: resolve
        env:
          RUNNER_ARCH: ${{ inputs.runner_arch }}
        run: |
          set -euo pipefail

          case "$RUNNER_ARCH" in
            x64) runner=ubuntu-26.04 ;;
            arm64) runner=ubuntu-26.04-arm ;;
            *) echo "::error::Unsupported runner architecture"; exit 1 ;;
          esac

          main_sha=$(gh api "repos/${REMOTE_REPOSITORY}/commits/${REMOTE_BRANCH}" --jq .sha)
          nss_sha=$(gh api "repos/${NSS_PACKAGES_REPOSITORY}/commits/${NSS_PACKAGES_REPOSITORY_BRANCH}" --jq .sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$nss_sha" =~ ^[0-9a-f]{40}$ ]]

          {
            echo "main_sha=$main_sha"
            echo "nss_sha=$nss_sha"
            echo "runner=$runner"
          } >> "$GITHUB_OUTPUT"

          echo "Runner: $runner"
          echo "Main SHA: $main_sha"
          echo "NSS SHA: $nss_sha"

  build_firmware:
    name: Build firmware (${{ inputs.runner_arch }})
    needs: resolve_sources
    runs-on: ${{ needs.resolve_sources.outputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      MAIN_SHA: ${{ needs.resolve_sources.outputs.main_sha }}
      NSS_SHA: ${{ needs.resolve_sources.outputs.nss_sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUNNER_ARCH: ${{ inputs.runner_arch }}
      CCACHE_MAXSIZE: 2G
      TZ: UTC
      LC_ALL: C
      KBUILD_BUILD_USER: builder
      KBUILD_BUILD_HOST: github
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bzip2 file gawk gettext git glibc-source \
            libncurses-dev libssl-dev python3 rsync unzip wget \
            zlib1g-dev zstd curl ca-certificates jq time

      - name: Checkout OpenWrt source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: openwrt

      - name: Checkout builder assets
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: builder_repo

      - name: Prepare source and configuration
        working-directory: openwrt
        run: |
          set -euo pipefail
          umask 022
          mkdir -p ../build-info

          # Pin the NSS feed to the exact commit resolved by the first job.
          # The obsolete OpenSSL KTLS sed modification has been removed.
          grep -q '^src-git nss_packages ' feeds.conf.default
          sed -i \
            "s|^src-git nss_packages .*|src-git nss_packages https://github.com/${NSS_PACKAGES_REPOSITORY}.git^${NSS_SHA}|" \
            feeds.conf.default

          ./scripts/feeds update -a
          actual_nss_sha=$(git -C feeds/nss_packages rev-parse HEAD)
          if [[ "$actual_nss_sha" != "$NSS_SHA" ]]; then
            echo "::error::NSS feed does not match the requested commit"
            exit 1
          fi
          ./scripts/feeds install -a

          # Record ALL feed revisions, not just the main and NSS commits.
          # Other feeds follow their configured branches on each fresh run.
          ./scripts/feeds list -s -f > ../build-info/feeds.lock

          cp "../builder_repo/${CONFIG_FILE}" .config
          # Enable ccache while preserving the firmware settings in the original config.
          sed -i '/^CONFIG_CCACHE=/d; /^# CONFIG_CCACHE is not set$/d; /^CONFIG_CCACHE_DIR=/d' .config
          {
            echo 'CONFIG_CCACHE=y'
            printf 'CONFIG_CCACHE_DIR="%s/.ccache"\n' "$GITHUB_WORKSPACE"
          } >> .config
          make defconfig V=s
          grep -qx 'CONFIG_CCACHE=y' .config
          cp .config ../build-info/ax9000.full.config
          ./scripts/diffconfig.sh > ../build-info/ax9000.diff.config

          main_epoch=$(git show -s --format=%ct HEAD)
          builder_sha=$(git -C ../builder_repo rev-parse HEAD)
          {
            echo "SOURCE_DATE_EPOCH=$main_epoch"
            echo "BUILDER_SHA=$builder_sha"
          } >> "$GITHUB_ENV"

          {
            echo "Runner architecture: $RUNNER_ARCH"
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "Main repository: $REMOTE_REPOSITORY"
            echo "Main commit: $MAIN_SHA"
            echo "NSS commit: $actual_nss_sha"
            echo "Builder commit: $builder_sha"
            echo "Source date epoch: $main_epoch"
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            uname -a
            lscpu
            free -h
            df -h /
          } | tee ../build-info/build-metadata.txt

      - name: Cache downloaded sources
        uses: actions/cache@v6
        with:
          path: openwrt/dl
          key: openwrt-dl-v1-${{ runner.os }}-${{ hashFiles('build-info/feeds.lock') }}-${{ env.MAIN_SHA }}
          restore-keys: |
            openwrt-dl-v1-${{ runner.os }}-

      - name: Cache compiler results
        uses: actions/cache@v6
        with:
          path: .ccache
          # Compiled cache entries are kept separate for each host architecture.
          key: openwrt-ccache-v1-${{ runner.os }}-${{ inputs.runner_arch }}-${{ hashFiles('builder_repo/ax9000.config', 'build-info/feeds.lock') }}-${{ env.MAIN_SHA }}
          restore-keys: |
            openwrt-ccache-v1-${{ runner.os }}-${{ inputs.runner_arch }}-

      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if make download -j"$(nproc)" V=s 2>&1 | tee ../build-info/download.log; then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::Download failed after 3 attempts"
              exit 1
            fi
            echo "Download attempt $attempt failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          started=$(date +%s)
          if ! /usr/bin/time -v make -j"$(nproc)" 2>&1 | tee ../build-info/build.log; then
            echo "::warning::Parallel build failed; retrying with one job and verbose output"
            /usr/bin/time -v make -j1 V=s 2>&1 | tee -a ../build-info/build.log
          fi
          elapsed=$(( $(date +%s) - started ))
          {
            echo "Build runner: $RUNNER_ARCH"
            echo "Build duration (seconds, excluding source download): $elapsed"
          } | tee -a ../build-info/build-metadata.txt >> "$GITHUB_STEP_SUMMARY"

          if [[ -x staging_dir/host/bin/ccache ]]; then
            CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" \
              staging_dir/host/bin/ccache --show-stats | tee ../build-info/ccache-stats.txt
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ax9000-images-${{ inputs.runner_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            openwrt/bin/targets/qualcommax/ipq807x/*
            !openwrt/bin/targets/qualcommax/ipq807x/packages/**
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload build information and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ax9000-build-info-${{ inputs.runner_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-info/
          if-no-files-found: warn
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Publish test Release
        if: ${{ inputs.publish_release }}
        id: release
        run: |
          set -euo pipefail
          build_date=$(date -u +%F)
          timestamp=$(date -u +%Y%m%dT%H%M%SZ)
          tag_name="${RELEASE_PREFIX}-${RUNNER_ARCH}-${timestamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          {
            echo '## OpenWrt AX9000 Test Build'
            echo "- Date: $build_date"
            echo "- Build runner: $RUNNER_ARCH"
            echo '- Firmware target: Xiaomi AX9000 (qualcommax/ipq807x)'
            echo "- Main commit: $MAIN_SHA"
            echo "- NSS commit: $NSS_SHA"
            echo "- Builder commit: $BUILDER_SHA"
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo 'All feed revisions are recorded in feeds.lock.'
            echo 'Other feeds are resolved at build time; identical main/NSS commits alone do not guarantee identical firmware.'
          } > release_notes.md

          mapfile -d '' -t assets < <(
            find openwrt/bin/targets/qualcommax/ipq807x/ -maxdepth 1 -type f -print0
          )
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No firmware assets found"
            exit 1
          fi
          assets+=(build-info/feeds.lock build-info/ax9000.full.config build-info/build-metadata.txt)

          gh release create "$tag_name" \
            --target "$BUILDER_SHA" \
            --title "AX9000 Test $build_date ($RUNNER_ARCH)" \
            --notes-file release_notes.md \
            --prerelease --latest=false \
            "${assets[@]}"
          gh release view "$tag_name"
          echo "release_tag=$tag_name" >> "$GITHUB_OUTPUT"

      - name: Delete older test Releases of the same architecture
        if: ${{ inputs.publish_release && steps.release.outcome == 'success' }}
        env:
          KEEP: ${{ env.RELEASES_TO_KEEP }}
          CURRENT: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          prefix="${RELEASE_PREFIX}-${RUNNER_ARCH}-"
          # Restrict cleanup to this test workflow's prefix and architecture.
          # Original workflow Releases and the other architecture are preserved.
          gh release list --limit 100 --exclude-drafts \
            --json tagName,publishedAt --order desc > test-releases.json
          jq -r --arg prefix "$prefix" --argjson keep "$KEEP" --arg current "$CURRENT" \
            '[.[] | select(.tagName | startswith($prefix))] |
             sort_by(.publishedAt) | reverse | .[$keep:][] |
             .tagName | select(. != $current)' \
            test-releases.json > old-test-release-tags.txt

          while IFS= read -r tag; do
            gh release delete "$tag" --yes --cleanup-tag
          done < old-test-release-tags.txt
